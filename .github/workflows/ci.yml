name: CI

on:
  push:
    # Inert until a release branch exists: a push runs the workflow file as
    # it stands on the pushed branch.
    branches: [main, 'release/**']
  # Unfiltered on purpose. A `branches:` filter here matches the pull request's
  # *base*, so restricting it to `main` would run CI only on the bottom of a
  # stacked pull request and leave every layer above it unbuilt until the whole
  # stack merged. The `build-complete` gate is required on `main`, and it can
  # only gate what it runs on.
  pull_request:

concurrency:
  # Only pull requests supersede each other. Pushes key on run_id, so a second
  # push to a release branch cannot cancel an in-flight publish.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No `RUSTFLAGS: -D warnings` here. Lint levels live in `[workspace.lints]`
  # in the root Cargo.toml, which applies them to this workspace's own crates
  # only and makes a local `cargo clippy` enforce exactly what CI does. As an
  # environment variable they also reached every dependency's source and were
  # part of the fingerprint each one was cached under.

jobs:
  changes:
    # Detect what changed so PRs that don't touch Rust/Python code can skip
    # the expensive compile jobs. Pushes (main and release branches) always
    # run everything so releases keep building regardless of which paths
    # changed.
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      catalog: ${{ steps.filter.outputs.catalog }}
      console_ui: ${{ steps.filter.outputs.console_ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/migrations/*.sql'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              # rust-lint installs cargo-deny through it.
              - 'ci/install-tool.sh'
              - 'about.toml'
              - 'about.hbs'
              - 'LICENSE'
              - 'NOTICE'
              - 'THIRD-PARTY-LICENSES.md'
              - 'docker/**'
              - '.github/**'
              # Rust tests include and parse the scheduler plans.
              - 'examples/plans/**'
              # httpapi's plan_validation test posts the app's examples.
              - 'ui/src/lib/plan-examples/**'
              # rust-lint's clippy reads them.
              - '**/clippy.toml'
              # route_docs.rs compiles them into the OpenAPI document, and its
              # tests read them.
              - 'docs/api/**'
              # Compiled in or read by tests: site.css, the planner's testdata.
              - 'crates/**'
            python:
              - '**/*.py'
              # python-check also tests tools/sign.ts.
              - 'tools/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/**'
            # The `rust` filter skips `examples/benchmarks/`, so a catalog-only
            # PR needs its own filter to reach the jobs that parse the catalog.
            # Just the TOML here: a change to the types it parses into is a
            # `.rs` change, which rust-test already covers.
            catalog:
              - 'examples/benchmarks/**'
              - '.github/**'
            # about.hbs credits the app's bundled npm packages by version.
            console_ui:
              - 'ui/**'
              - 'about.hbs'
              - '.github/**'

  release-metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0 # ci/version.sh needs the history behind the branch point
      - name: Compute release metadata
        id: version
        run: |
          # Assign first: `echo "v=$(cmd)"` succeeds even when cmd fails, and
          # the default shell is `bash -e` with no pipefail, so echoing the
          # substitutions straight into tee would swallow the failure.
          set -euo pipefail
          version="$(ci/version.sh version)"
          image="$(ci/version.sh image)"
          {
            echo "version=${version}"
            echo "image=${image}"
          } | tee -a "$GITHUB_OUTPUT"

  conventions:
    # Repo-convention checks (see ci/README.md): the rules rustfmt, clippy and
    # rustdoc cannot express. Its own job so a failure shows up as a distinct
    # `conventions` status rather than buried in rust-lint, and deliberately
    # unfiltered — it needs no toolchain, so it stays seconds long, and running
    # on every PR is what lets `rust-path-refs` catch a Rust-only change that
    # breaks a reference from `docs/`, and a docs-only PR still have its prose
    # checked.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Convention checks
        run: ./ci/lint.sh

  rust-lint:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: lint
      - run: cargo fmt --all -- --check

      - name: Install cargo-deny (pinned, checksum-verified)
        # The same pinned, checksum-verified build security.yml runs, from
        # ci/install-tool.sh. One policy file deserves one version of the tool
        # that reads it: a marketplace action resolving `latest` here would let
        # the two jobs disagree about deny.toml on a release day.
        run: ci/install-tool.sh cargo-deny

      - name: Licenses
        # Fails on any dependency license outside deny.toml's allow-list. Placed
        # before the compile steps because it only reads cargo metadata — a
        # rejected license turns the job red in seconds instead of after a full
        # build. THIRD-PARTY-LICENSES.md, checked by `attribution`, is the
        # attribution that follows from this policy.
        #
        # Advisories, bans and sources are in security.yml: they need no build
        # and can go red with no change here. Licenses stay next to the
        # attribution they feed.
        run: cargo deny check licenses

      - name: Clippy
        # Lint levels (deny-on-warnings, and the ban on unwrap/expect/panic)
        # come from `[workspace.lints]` in the root Cargo.toml, so no
        # `-- -D warnings` here. `--all-targets` is what puts tests and the
        # binary under the same policy as the library.
        run: cargo clippy --workspace --all-targets --locked

      - name: Clippy (plan-types without `schemars`)
        # pipette-httpapi turns the feature on, so the step above always
        # compiles it; a client builds it off.
        run: cargo clippy -p pipette-plan-types --all-targets --locked

      - name: Docs
        # `[`Type`]` links are how the module docs connect the stores, the
        # handlers and the CLI, and nothing in build/clippy/test reads one, so
        # they rot silently. Lint levels come from `[workspace.lints]`, same as
        # Clippy above; `--no-deps` keeps the gate on the workspace's own docs.
        run: cargo doc --workspace --no-deps --locked

  # THIRD-PARTY-LICENSES.md ships inside the release tarball and the container
  # image, so a copy that lags the dependency graph publishes incomplete
  # attribution. Regenerate and require the committed file to match.
  attribution:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: attribution
      - name: Install cargo-about
        # The `cli` feature gates the binary; without it `cargo install`
        # silently installs nothing. The version is pinned because the
        # generator's output must match the committed file byte for byte, and a
        # release that alters template context or license-text selection would
        # fail the comparison on an unrelated change.
        run: cargo install cargo-about --version 0.9.1 --locked --features cli
      - name: Regenerate and compare
        run: |
          set -euo pipefail
          cargo about generate about.hbs -o /tmp/THIRD-PARTY-LICENSES.md
          if ! diff -u THIRD-PARTY-LICENSES.md /tmp/THIRD-PARTY-LICENSES.md; then
            echo "::error::THIRD-PARTY-LICENSES.md is stale. Regenerate it with 'cargo about generate about.hbs -o THIRD-PARTY-LICENSES.md' and commit the result. See docs/third-party-attribution.md."
            exit 1
          fi

  # The tier rules the root Cargo.toml describes: which crate may link the S3
  # SDK, which may name a backend, which may link an HTTP server framework.
  # `ci/checks/crate-layering.py` holds the table and reads it two ways. The
  # `conventions` job runs the manifest half, which needs no toolchain. This job
  # runs the resolved half, which asks cargo for each crate's whole graph and so
  # catches a forbidden crate reached through a chain rather than a direct edge.
  layering:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
      - name: Resolved dependency graph
        # `cargo tree` resolves the graph from the lock file and compiles
        # nothing, so this job needs no build cache.
        run: ./ci/checks/crate-layering.py --resolved

  # Operators `cp -r examples/benchmarks` into their data dir
  # (docs/development.md), so a malformed entry there is a server that will not
  # boot. Scoped to pipette-core and the one httpapi test that reads the catalog,
  # so a catalog-only PR skips the full rust-test run.
  catalog:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.catalog == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: catalog
      - name: Shipped benchmark catalog
        run: cargo test -p pipette-core --locked
      - name: App example plans against the catalog
        run: cargo test -p pipette-httpapi --locked --test suite -- plan_validation::every_app_example_validates --exact

  rust-test:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    # The PostgreSQL tests fail rather than skip in CI without
    # TEST_DATABASE_URL.
    services:
      postgres:
        image: postgres:17@sha256:ae69c452f483507a6b99fb654cf93aad7fe156ffd2c56247707eef4e36d3c12b
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          # Listings sort in byte order, so the cluster is `C`.
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: test
      - name: Install nextest
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab  # v2.87.13
        with:
          tool: nextest
      - name: Test
        # nextest runs the test binaries in parallel but does not execute
        # doctests, so keep a `--doc` pass to preserve that coverage. The
        # examples in the module docs are the ones a reader copies.
        run: |
          cargo nextest run --workspace --locked
          cargo test --workspace --doc --locked
      - name: Test plan-types without `schemars`
        # pipette-pipeline turns the feature on, so the run above always builds
        # it; a client builds it off.
        run: cargo nextest run -p pipette-plan-types --locked

  console-ui:
    # The Svelte app at /app/. Its build is embedded by build-artifact; a Rust
    # build without it serves a placeholder page instead.
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.console_ui == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        # A stalled registry otherwise hangs the job until the 6h default.
        timeout-minutes: 10
      - name: Generated types match api-schema.json
        # rust-test keeps api-schema.json current with the Rust types.
        run: npm run types && git diff --exit-code -- src/lib/api-types.ts
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Every bundled npm package is credited in THIRD-PARTY-LICENSES.md
        # `npm run build` lists the packages the bundle carries (vite.config.ts).
        run: |
          status=0
          while read -r name version; do
            grep -q -- "^- ${name} ${version} — " ../about.hbs \
              || { echo "::error::about.hbs does not credit ${name} ${version}; add it and regenerate THIRD-PARTY-LICENSES.md"; status=1; }
          done < node_modules/.cache/bundled-packages.txt
          exit "${status}"

  python-check:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync Python dev environment
        run: uv sync --group dev
      - name: Ruff check
        run: uv run ruff check examples tools
      - name: Ruff format
        run: uv run ruff format --check examples tools
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
      - name: Signing tools tests
        run: |
          uv run python -m unittest discover -s tools/tests
          node --test tools/tests/sign.test.ts

  build-artifact:
    needs: [release-metadata, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: bin-${{ matrix.target }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the console app
        # build.rs embeds ui/dist; without it the binary serves a placeholder at /app/.
        working-directory: ui
        timeout-minutes: 10
        run: npm ci && npm run build
      - name: Build release binary
        env:
          # Fails the build rather than embedding the placeholder page.
          PIPETTE_REQUIRE_UI: "1"
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package tarball
        id: pkg
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          NAME="pipette-mgmt-${VERSION}-${TARGET}"
          STAGE="dist/${NAME}"
          mkdir -p "${STAGE}"
          cp "target/${TARGET}/release/pipette-mgmt" "${STAGE}/"
          strip "${STAGE}/pipette-mgmt" || true
          cp README.md "${STAGE}/"
          # The tarball redistributes first-party and third-party code together,
          # so it carries the terms covering each: the project's own license and
          # NOTICE, which Apache-2.0 section 4 requires travel with any
          # distribution, plus the notices the dependency licenses require
          # alongside their code.
          cp LICENSE NOTICE THIRD-PARTY-LICENSES.md "${STAGE}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
          echo "tarball=dist/${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${NAME}.tar.gz.sha256" >> "$GITHUB_OUTPUT"
      # PR runs are the bulk of the uploads, so a PR tarball keeps the shorter
      # window. `docker-image-build` consumes it inside the same run, and the
      # days after that are for a reviewer who wants to download the build and
      # try it. A push tarball keeps the longer window, as a fallback copy
      # while `github-release` attaches it to the release.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pipette-mgmt-${{ matrix.target }}
          path: |
            ${{ steps.pkg.outputs.tarball }}
            ${{ steps.pkg.outputs.checksum }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 5 || 14 }}

  # The API reference as a static page for another host; never mgmt, whose
  # origin holds the app's signing keys. Skipped with build-artifact.
  api-docs:
    needs: [release-metadata, build-artifact]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pipette-mgmt-x86_64-unknown-linux-gnu
          path: artifact
      - name: Build the page
        env:
          NAME: pipette-mgmt-${{ needs.release-metadata.outputs.version }}-x86_64-unknown-linux-gnu
        run: |
          set -euo pipefail
          tar -C artifact -xzf "artifact/${NAME}.tar.gz"
          "artifact/${NAME}/pipette-mgmt" openapi --site api-docs
      # mgmt serves the page at /docs/; the artifact is for reviewing a PR's render.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pipette-mgmt-api-docs
          path: api-docs/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 5 || 14 }}

  # Per-arch Docker build on a native runner (no qemu). The binary is taken
  # from the build-artifact job's tarball rather than recompiled inside the
  # Dockerfile, so this step is essentially `apt-get install + COPY`.
  #
  # Each arch pushes a digest with no tag; docker-image-publish joins them.
  # Tagging here would race the two runners against each other.
  docker-image-build:
    # The image embeds THIRD-PARTY-LICENSES.md and pushes by digest, so the
    # attribution check has to pass before anything reaches the registry.
    needs: [release-metadata, build-artifact, attribution]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Download prebuilt binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pipette-mgmt-${{ matrix.target }}
          path: artifact
      - name: Stage binary into target/<triple>/release
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          NAME="pipette-mgmt-${RELEASE_VERSION}-${TARGET}"
          tar -C artifact -xzf "artifact/${NAME}.tar.gz"
          mkdir -p "target/${TARGET}/release"
          cp "artifact/${NAME}/pipette-mgmt" "target/${TARGET}/release/pipette-mgmt"
          chmod +x "target/${TARGET}/release/pipette-mgmt"
          file "target/${TARGET}/release/pipette-mgmt"
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4.4.0
      # GHCR needs no configured secret: the job-scoped GITHUB_TOKEN carries
      # `packages: write`.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image (pushed by digest, except on pull requests)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: docker/pipette-mgmt.Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BIN=target/${{ matrix.target }}/release/pipette-mgmt
          # A pull request proves the Dockerfile still builds; only main and
          # release branches push. Digest-only push needs the `outputs` form,
          # so the whole exporter switches rather than a `push:` flag.
          outputs: >-
            ${{ github.event_name == 'pull_request'
              && 'type=cacheonly'
              || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', needs.release-metadata.outputs.image) }}
          # Layer cache to GitHub Actions cache. The wrapper image only has
          # one heavy layer (apt-get install in the runtime stage), so the
          # cache is small. Per-arch scope so amd64 and arm64 don't invalidate
          # each other; PRs also fall back to main's scope.
          cache-from: |
            type=gha,scope=docker-${{ matrix.arch }}-${{ github.ref_name }}
            type=gha,scope=docker-${{ matrix.arch }}-main
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}-${{ github.ref_name }}
      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Filename is the digest; contents unused.
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: docker-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-image-publish:
    if: github.event_name != 'pull_request'
    needs: [release-metadata, docker-image-build]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: docker-digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4.4.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest list
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ needs.release-metadata.outputs.image }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            $(printf "${IMAGE}@sha256:%s " *)
          # Read it back so a broken manifest fails here, not at pull time.
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

  # Single aggregate gate so the default branch can require one check instead of
  # naming each job. Without it, branch protection has to list contexts by hand,
  # and a job added later is unprotected until someone remembers to add it.
  build-complete:
    # `changes` and `release-metadata` are included deliberately: a job whose
    # `needs` failed is reported as "skipped", and the check below tolerates
    # skips. Depending on them directly means a failure in the path filter or
    # version computation fails this gate instead of passing as a skip.
    needs:
      - changes
      - release-metadata
      - conventions
      - rust-lint
      - attribution
      - layering
      - catalog
      - rust-test
      - console-ui
      - python-check
      - build-artifact
      - api-docs
      - docker-image-build
      - docker-image-publish
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify all upstream jobs succeeded
        run: |
          set -euo pipefail
          # Treat 'skipped' as OK: the compile jobs are gated by path filters on
          # PRs that touch neither Rust nor Python. Only real failures and
          # cancellations should fail the gate.
          result='${{ join(needs.*.result, ',') }}'
          echo "upstream results: ${result}"
          case "${result}" in
            *failure*|*cancelled*)
              echo "::error::one or more upstream jobs did not succeed"
              exit 1
              ;;
          esac

  # Main pushes the image; only a release branch also cuts a release.
  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    needs: [release-metadata, build-complete]
    runs-on: ubuntu-24.04
    # Two pushes to one release branch must not race to create the same tag.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          # Only the shipped tarballs; the digest and api-docs artifacts are
          # build plumbing.
          pattern: pipette-mgmt-*-linux-gnu
          merge-multiple: true
          path: dist
      - name: Create GitHub release
        # Pinned: the only job here holding a repo-write token.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ needs.release-metadata.outputs.version }}
          name: ${{ needs.release-metadata.outputs.version }}
          generate_release_notes: true
          body: |
            ### Container image

            ```
            docker pull ${{ needs.release-metadata.outputs.image }}:${{ needs.release-metadata.outputs.version }}
            ```

            Multi-arch (`linux/amd64`, `linux/arm64`).
            Per-target binaries and checksums are attached below.
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

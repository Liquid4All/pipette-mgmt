# Model catalog: maps a normalized model_name to its parameter count(s) in
# millions. Loaded by `pipette-mgmt serve` and `pipette-mgmt score` from
# `{data_dir}/model_params_mapping.toml` for local-fs or `{prefix}/model_params_mapping.toml` in the
# S3 bucket. The scorer uses this to set the canonical
# `model_params_total_millions` and `model_params_active_millions` columns on
# every warehouse row.
#
# Counts are in millions. Integer entries are shorthand for dense models:
# total = active = value.
#
# For MoE / selective-activation architectures (Granite MoE, Gemma E*B /
# 3n, LFM2 A1B), spell both with the inline-table form:
#
#   "DenseModel-X" = 1234                                  # total = active = 1234
#   "MoE-Model"    = { total = 8000, active = 1000 }       # MoE / selective activation
#
# `total` is the primary model-weight memory footprint proxy. Runtime
# RAM/VRAM also depends on dtype/quantization, KV cache, context length,
# batching, tensor parallelism, and serving implementation. `active` is
# the parameter path used as the prefill/decode throughput proxy.
#
# Counts should be exact tensor / state-dict parameter counts rounded or
# truncated to the nearest whole million, unless the upstream card only
# provides a rounded marketing count. Marketing labels like "7B" or "8B"
# are not assumed to be exact.
#
# For VLMs, `total` includes the language model, vision encoder, and any
# projectors. `active` means the text-token decode path unless explicitly
# stated otherwise — image prefill may activate additional vision encoder
# parameters beyond the text LM path.
#
# Validation: total > 0, active > 0, active <= total. Bad values are
# rejected at load time.
#
# Keys are the *normalized* model name — no `org/` prefix, no
# `:file.gguf` suffix, no `-GGUF` suffix. Submissions go through the
# same normalization before lookup.
#
# Operators: copy this file to `data/model_params_mapping.toml` (or
# `s3://<bucket>/<prefix>/model_params_mapping.toml`) and add entries as new models
# come online. A missing model_params_mapping.toml is not an error — the scorer just
# trusts whatever values the client sent.
#
# Every entry below is anchored to the upstream HuggingFace model card.


# Example plan: OpenVINO IR on an Intel Lunar Lake box — CPU / iGPU / NPU,
# through both OpenVINO engines.
#
# Target: Intel Core Ultra 7 258V (Lunar Lake), Arc 140V iGPU, Intel AI Boost
# NPU, Windows 11. The first venv-backed runtime that is not POSIX-hosted, hence
# `shell = "powershell"` and the `C:/` paths.
#
# Every variant lists both engines at one OpenVINO release, so each (model,
# device, benchmark) cell runs once per engine: `uv_openvino` 2026.4.0
# (`openvino-genai` in a uv venv) and `ovms` v2026.4.0 (Intel's OpenVINO Model
# Server, which bundles the same release). A flag row is keyed on
# (benchmark_type, runtime_type, model_type), and the two engines are different
# runtime types, so one variant carries both engines' rows. See docs/ovms.md.
#
# Models come from a Hugging Face repo (here the placeholder
# example-org/openvino-models; set your own) laid out as
# <Model>/<precision>/ — which is exactly what `prefix` addresses. Set
# PIPETTE_HF_TOKEN on the runner; it is injected into the tokenless model
# definition at the run boundary, so no token belongs in this file. (That also
# means these must stay in structural TOML form: a `openvino://` URI cannot
# carry a token.)
#
# Variants are ordered smallest model first — 230M, 350M, 1.2B, then MoE. Run
# top-down and stop when something looks wrong rather than queueing the whole
# matrix blind. For first bring-up, pass `--limit` so only the first cells of
# the 230M CPU variant run before the GPU or NPU rows do.
#
# 240 cells at 5 reps each, 120 per engine.
#
# --- Why the precision split ---------------------------------------------
#
# Precision follows the device, not preference. The NPU rejects asymmetric
# weights, so NPU rows take the symmetric ladder (fp16, int8-sym, int4-sym-cw,
# int4-sym-gq128) while CPU/GPU rows take the asymmetric one (fp16, int8-asym,
# int4-asym-gq128). That is why every model appears in two variants rather than
# one: a shared variant would pair NPU with weights it cannot run.
#
# `int4-sym-cw` is the canonical NPU recipe; `int4-asym-gq128` is the canonical
# CPU/GPU one. See docs/openvino-ir.md.
#
# --- Nothing here authors runtime flags -----------------------------------
#
# The NPU's static-shape knobs are derived from the cell by `pipette-openvino`'s
# `flags.rs`, so the plan does not need to set them. In particular
# `MIN_RESPONSE_LEN` is raised automatically for `end_to_end_latency_512_256`
# (256 response tokens against GenAI's 128 default), which is why the NPU rows
# run the full four-benchmark suite.
#
# `MAX_PROMPT_LEN` stays at the 1024 default and every cell here fits under it
# (512 prompt). A cell over that bound is rejected rather than the bound raised
# — raising it costs compile time superlinearly (17.8s -> 26.9s at 2048 ->
# 62.8s at 4096) and walks into the unresolved single-token behaviour
# docs/openvino-ir.md records at those larger static shapes.
#
# Authorable overrides do exist (`max_prompt_len`, `min_response_len`,
# `generate_hint` on the four `*UvOpenvinoOpenvino` and four `*OvmsOpenvino`
# RuntimeFlags variants) if a future cell needs to accept those costs
# deliberately. The ovms rows leave `prefix_caching` unset, which the client
# resolves to off.
#
# --- MoE has no NPU path --------------------------------------------------
#
# LFM2.5-8B-A1B, LFM2-8B-A1B and LFM2-24B-A2B are CPU/GPU only per OpenVINO's
# support matrix, so they appear in no NPU variant. Preflight also reads
# `config.json` and rejects a MoE model on NPU, so a mis-declared coordinate
# cannot slip past this plan's structure.
#
# --- The 24B fits, but only just ------------------------------------------
#
# LFM2-24B-A2B/int4-asym-gq128 is a 12 GB IR and the box has 31.6 GiB of
# on-package memory, shared with the iGPU. It fits; it is not comfortable.
# Expect the GPU rows to be the ones that struggle, and run this variant last
# (it already is) so a failure there costs nothing else.
#
# State written to
# .pipette-ctl/plans/intel-openvino/state.jsonl.

plan_id = "intel-openvino"
benchmarks = [
  "prefill_throughput_512",
  "decode_throughput_512_100",
  "end_to_end_latency_512_256",
  "max_memory_usage_512",
]

[[transports]]
client_id   = "intel-node-1"
type        = "ssh"
host        = "intel-node-1"
user        = "eval"
binary_path = "C:/pipette/pipette.exe"
work_dir    = "C:/pipette"
shell       = "powershell"

[retry]
max_consecutive_failures = 5

# --------------------------------------------------------------------------
# LFM2.5-230M — 151 MB int4. Smallest model; start here.
# --------------------------------------------------------------------------

[[variants]]
clients = ["intel-node-1"]
models = [
  { type = "openvino", source = "huggingface", org = "example-org", repo_name = "openvino-models", prefix = "LFM2.5-230M/int4-asym-gq128" },
]
runtimes = [
  { type = "uv_openvino", server_version = "2026.4.0", python_version = "3.11", source = { type = "pip_requirements_text", contents = "numpy==2.4.6\nopenvino==2026.4.0\nopenvino-genai==2026.4.0.0\nopenvino-telemetry==2025.2.0\nopenvino-tokenizers==2026.4.0.0\n" } },
  { type = "ovms", source = "github_release", repository_url = "github.com/openvinotoolkit/model_server", repository_version = "v2026.4.0", flavor = "windows-x64" },
]
runtime_flags = [
  { benchmark_type = "prefill_throughput", runtime_type = "uv_openvino", model_type = "openvino", device = "cpu" },
  { benchmark_type = "decode_throughput", runtime_type = "uv_openvino", model_type = "openvino", device = "cpu" },
  { benchmark_type = "end_to_end_latency", runtime_type = "uv_openvino", model_type = "openvino", device = "cpu" },
  { benchmark_type = "max_memory_usage", runtime_type = "uv_openvino", model_type = "openvino", device = "cpu" },
  { benchmark_type = "prefill_throughput", runtime_type = "ovms", model_type = "openvino", device = "cpu" },
  { benchmark_type = "decode_throughput", runtime_type = "ovms", model_type = "openvino", device = "cpu" },
  { benchmark_type = "end_to_end_latency", runtime_type = "ovms", model_type = "openvino", device = "cpu" },
  { benchmark_type = "max_memory_usage", runtime_type = "ovms", model_type = "openvino", device = "cpu" },
]


# Example plan: unified pipette client, vLLM Docker runtime over SSH.
#
# State written to
# .pipette-ctl/plans/torch-oai-vllm-linux-example/state.jsonl.

plan_id = "torch-oai-vllm-linux-example"
benchmarks = ["prefill_throughput_512", "decode_throughput_512_100", "eval_smoke"]

[[transports]]
client_id   = "linux-gpu-1"
type        = "ssh"
host        = "linux-gpu-1"
user        = "eval"
binary_path = "/home/eval/bin/pipette"
work_dir    = "/home/eval/pipette"
shell       = "posix"

[retry]
max_consecutive_failures = 5

[[variants]]
clients = ["linux-gpu-1"]
models = [
  { type = "torch", source = "huggingface", org = "Qwen", repo_name = "Qwen2.5-0.5B-Instruct" },
]
runtimes = [
  { type = "docker_vllm", image_name = "vllm/vllm-openai", image_tag = "v0.21.0", flavor = "nvidia_gpu" },
]
# The timing cells derive `max_model_len` from their shape (prompt plus
# generation); eval's 4096 is a pin.
runtime_flags = [
  { benchmark_type = "eval", runtime_type = "docker_vllm", model_type = "torch", max_model_len = 4096 },
]
# Model-generation flags, keyed on (benchmark, model); eval-only.
model_flags = [
  { benchmark_type = "eval", model_type = "torch", enable_thinking = true },
]

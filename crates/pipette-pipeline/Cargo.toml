[package]
name = "pipette-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Levels and the reasoning for each live in the root manifest.
[lints]
workspace = true

[features]
# `schemars::JsonSchema` on the variant edit, for mgmt's OpenAPI document.
schemars = ["dep:schemars", "pipette-planner/schemars"]

[dependencies]
pipette-core.workspace = true
pipette-plan-types.workspace = true
pipette-planner.workspace = true
pipette-store.workspace = true
anyhow.workspace = true
bytes.workspace = true
chrono.workspace = true
futures.workspace = true
hex.workspace = true
libc.workspace = true
rustix.workspace = true
# `stream` gives `Response::bytes_stream`, which an import streams a download
# through.
reqwest = { workspace = true, features = ["stream"] }
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
strsim.workspace = true
strum.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
# The dataset cache parses an evals server body on a blocking thread as it arrives.
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
httpmock.workspace = true
# The mock evals server of the dataset-cache tests, and the `data:` images it serves.
axum.workspace = true
base64.workspace = true
# The mock HuggingFace Hub and CDN of the import tests.
pipette-hub-testkit.workspace = true
# `testkit` carries the shared `plan` fixtures and `JobId::new_unchecked` across
# the crate boundary. Cargo unifies features within a build, so they are present
# for `cargo test` and absent from `cargo build --release`.
pipette-core = { workspace = true, features = ["testkit"] }
# Both backends support tests that drive stores directly. The queue-maintenance
# sweep test constructs `S3TodoStore` with its own mock client. `testkit` gives
# the in-memory S3 submission store that the decode-count test reads.
pipette-store-fs.workspace = true
pipette-store-s3 = { workspace = true, features = ["testkit"] }
# `TEST_LIST_LIMIT`, which the requeue tests page a listing with.
pipette-store-testkit.workspace = true
# `testkit` gives the scratch PostgreSQL database of the tests that need the
# job-cell index, which only the SQL store keeps.
pipette-store-sql = { workspace = true, features = ["testkit"] }
# The fake stores in the test modules here implement the async store traits.
async-trait.workspace = true
# The mock transport the queue-maintenance sweep test builds its bucket from. A
# dev-dependency, so `test-util` and the hyper 0.14 connector it requires stay
# out of every release build.
aws-sdk-s3 = { workspace = true, features = ["test-util"] }
aws-smithy-mocks.workspace = true
rstest.workspace = true
tempfile.workspace = true

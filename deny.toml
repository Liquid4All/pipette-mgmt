# cargo-deny configuration: the license and security-advisory gates for the
# Rust build.
#
# Run locally with `cargo deny check licenses advisories`. CI splits the two:
# `cargo deny check licenses` is a step in the `rust-lint` job of
# .github/workflows/ci.yml, next to the `attribution` job the license policy
# feeds, and advisories, bans and sources run in .github/workflows/security.yml,
# which needs no build and re-runs on a daily cron.
#
# Needs cargo-deny 0.19+. Older builds abort on any advisory carrying a CVSS 4.0
# vector ("unsupported CVSS version: 4.0") before reading this file, which looks
# like a policy failure but is a stale tool. CI installs the current release.
#
# This is the license policy; THIRD-PARTY-LICENSES.md is the resulting
# attribution, generated by `cargo about` and checked by the `attribution` job.
# The two read the same graph and are meant to agree: a license this file rejects
# should never reach that file. See docs/third-party-attribution.md.

[graph]
# The targets this server is built for, plus the macOS host developers work on.
# A host-only check would miss a dependency that only appears under
# cfg(target_os = "linux") — where this binary actually runs.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
# Evaluate every feature combination's dependencies, so a license can't slip in
# behind a feature flag that the default build happens not to enable.
all-features = true

[licenses]
# Allow-list, not a deny-list: an unrecognized license fails the check. That is
# the point — a new copyleft dependency should turn CI red rather than depend on
# someone having predicted its exact SPDX id.
allow = [
    # --- the licenses actually present in the graph ---
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Weak copyleft, allowed: MPL-2.0 operates per file, so it reaches only the
    # dependency's own sources even when statically linked. (L)GPL reaches ours,
    # which is why nothing in that family appears here.
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # --- the permissive tail ---
    "0BSD",
    "BSD-1-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0", # webpki-roots, webpki-root-certs
    "ISC",
    "OpenSSL",
]

# The allow-list is a policy — which licenses are acceptable — so it may name
# licenses no crate in today's graph carries. This setting keeps those entries
# quiet; otherwise each emits a `license-not-encountered` warning on every run,
# and a gate that always prints warnings is a gate people stop reading.
unused-allowed-license = "allow"

# This repository's own crates carry `license = "Apache-2.0"`, but none of them
# is published (`publish = false`), and this setting keys off that. Third-party
# dependencies are still checked; this only stops the workspace members from
# being judged against a policy meant for other people's code.
[licenses.private]
ignore = true

# The RUSTSEC gate. Unlike the license allow-list this policy is a moving target:
# the database is fetched at check time, so a newly published advisory can turn a
# green `main` red with no change here. A red advisories step is often not the
# triggering PR's doing.
[advisories]
# A yank is usually the author withdrawing a broken or compromised version, so
# treat it as an advisory rather than a warning.
yanked = "deny"

# "all" covers transitive crates, so an abandoned dependency is visible even when
# nothing we name pulls it directly. The trade is that an unfixable transitive
# case needs an explicit entry below, matching the licenses gate's allow-list
# stance above.
unmaintained = "all"

# Each entry's `reason` says why the crate is out of reach. An ignore that
# outlives its reason is how a real advisory gets waved through.
ignore = []

# What may enter the graph at all, independently of license and advisory. No
# crate is banned by name today; the gate that earns this section's place is
# `wildcards`, which rejects a `version = "*"` requirement — a dependency that
# accepts any future release is one no review of this lockfile can bound.
[bans]
wildcards = "deny"
# The exception the rule needs: a path dependency carries no version
# requirement, so a workspace member such as `pipette-core` reads as a wildcard
# to this check. It is built from this tree, not resolved from a registry, which
# is the whole reason the rule above exists.
allow-wildcard-paths = true
# The ~20 duplicate pairs here (two `h2` majors, two `hyper`, two `syn`) are all
# transitive and none are ours to fix. Reporting rather than silencing them
# would print twenty warnings on every run, for the reason
# `unused-allowed-license` is set above.
multiple-versions = "allow"

# Where crates may come from. Everything here resolves through crates.io, and a
# git or alternate-registry dependency should arrive as a reviewed decision
# rather than as a line in a lockfile diff — including one that points at a fork
# of a crate whose name still looks familiar.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
